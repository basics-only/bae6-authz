[project]
name = "bae6-authz"
version = "0.0.0"
description = "Python SDK for the bae6-authz authorization API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bae6_authz"]
