name: bae6-authz

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?set in .env}
      BAE6_DB_PASSWORD: ${BAE6_DB_PASSWORD:?set in .env}
    # Loopback only, so host-run tooling (make migrate, API tests) can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  openfga-migrate:
    image: openfga/openfga:v1.10.2
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.10.2
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=disable
      # Off unless BAE6_OPENFGA_TRACE=true; see the observability profile below.
      OPENFGA_TRACE_ENABLED: ${BAE6_OPENFGA_TRACE:-false}
      OPENFGA_TRACE_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  api: &api
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      PORT: "8080"
      OPENFGA_API_URL: http://openfga:8080
      BAE6_DATABASE_URL: postgres://authz:${BAE6_DB_PASSWORD:?set in .env}@postgres:5432/authz
      # Local development only: the image defaults to production, which refuses fixture auth.
      NODE_ENV: development
      BAE6_AUTH_MODE: fixture
      BAE6_FIXTURE_AUTH_FILE: /etc/authz/auth.json
      BAE6_FIXTURE_END_USERS_FILE: /etc/authz/end-users.json
      # Both off when empty. Set them in .env and use --profile observability.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      BAE6_METRICS_PORT: ${BAE6_METRICS_PORT:-}
      # Reachable by Prometheus on the compose network only; the port is not published.
      BAE6_METRICS_HOST: 0.0.0.0
    volumes:
      - ./fixtures/auth.json:/etc/authz/auth.json:ro
      - ./fixtures/end-users.json:/etc/authz/end-users.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started

  console:
    build:
      context: ..
      dockerfile: deploy/console.Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  # Opt-in: docker compose --profile replicas up --build lb
  # N stateless API replicas (BAE6_REPLICAS, default 2) behind an nginx round-robin LB on
  # 127.0.0.1:8090. The LB tags each response with the replica that served it.
  api-replica:
    <<: *api
    profiles: [replicas]
    ports: []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      replicas: ${BAE6_REPLICAS:-2}

  lb:
    image: nginx:1.27.3-alpine
    profiles: [replicas]
    volumes:
      - ./lb.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    # nginx resolves the replicas once at start, so wait until every one is up.
    depends_on:
      api-replica:
        condition: service_healthy

  # Opt-in: docker compose --profile observability up. With these in .env:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318  BAE6_METRICS_PORT=9464  BAE6_OPENFGA_TRACE=true
  # Jaeger UI http://127.0.0.1:16686, Prometheus http://127.0.0.1:9090.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pgdata:
